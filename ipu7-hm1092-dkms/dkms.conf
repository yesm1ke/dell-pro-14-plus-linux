PACKAGE_NAME="ipu7-hm1092"
PACKAGE_VERSION="@PKGVER@"
# Patched ipu-bridge replaces the stock one (updates/ is searched first), but
# only for a kernel whose stock ipu-bridge has the same source (see the script).
PRE_BUILD="check-ipu-bridge ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="ipu-bridge"
BUILT_MODULE_NAME[1]="hm1092"
DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
