# Intel IPU7 laptop camera (Dell Pro 14 Plus PB14250).
# Install: copy to ~/.config/wireplumber/wireplumber.conf.d/, then
# systemctl --user restart wireplumber
# Do NOT hide the raw IPU7 V4L2 device with device.disabled: in WirePlumber
# 0.5.17 monitors/v4l2/create-device.lua returns without transition:advance()
# for a disabled device, which stalls the event dispatcher and leaves the
# session with no audio (only "Dummy Output"). See omacom/omarchy#12720.

# The camera reaches every app through a v4l2loopback device fed on demand by
# v4l2-relayd (package ipu7-camera-loopback). libcamera allows one owner per
# camera and PipeWire's libcamera monitor keeps it acquired even while the node
# is suspended, which would block the relay. PipeWire picks the loopback device
# up through its V4L2 monitor instead.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}

# Without the libcamera monitor, the V4L2 monitor turns each raw IPU7 capture
# node (Bayer data, unusable for apps) into a camera. Hide them per node:
# create-node.lua, unlike create-device.lua, advances the event correctly.
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.driver = "isys" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
