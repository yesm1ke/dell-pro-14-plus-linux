# v4l2-relayd instance: Intel camera HAL (hardware ISP via psys) -> /dev/video50 "Built-in Camera".
# The relay starts the camera only while some app has the virtual device open.
# The sensor delivers ~26 fps; 30/1 is the advertised rate.
VIDEOSRC="icamerasrc device-name=ov05c10-uf ! video/x-raw,format=NV12,width=1920,height=1080 ! videoconvert"
FORMAT=YUY2
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
CARD_LABEL="Built-in Camera"
