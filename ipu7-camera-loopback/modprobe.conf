# One virtual camera for the IPU7 laptop camera, fed by v4l2-relayd.
# exclusive_caps=1: report only CAPTURE while a producer is attached, which
# Chromium and other WebRTC apps require to accept the device as a webcam.
options v4l2loopback devices=1 video_nr=50 exclusive_caps=1 card_label="Built-in Camera"
